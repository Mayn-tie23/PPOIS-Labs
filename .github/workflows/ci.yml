
name: PPOIS Lab 1 CI

on:
  push:
    branches: [main, feature/lab1]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S lab1 -B lab1/build -G "Visual Studio 17 2022" -A x64

      - name: Build project
        run: cmake --build lab1/build --config Debug

      - name: Run unit tests
        run: ctest --test-dir lab1/build -C Debug --output-on-failure

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y --no-progress

      - name: Check Set and Polynomial coverage
        shell: pwsh
        run: |
          $tool = "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe"

          if (!(Test-Path $tool)) {
            throw "OpenCppCoverage executable not found"
          }

          foreach ($item in @(
            @{ Name = "Set"; Source = "Set.cpp"; Test = "SetTests" },
            @{ Name = "Polynomial"; Source = "Polynomial.cpp"; Test = "PolynomialTests" }
          )) {
            $report = "lab1/build/$($item.Name).xml"
            $exe = "lab1/build/Debug/$($item.Test).exe"

            & $tool --sources $item.Source --export_type "cobertura:$report" -- $exe

            if ($LASTEXITCODE -ne 0) {
              throw "Coverage execution failed for $($item.Name)"
            }

            [xml]$xml = Get-Content $report
            $rate = [double]$xml.coverage.'line-rate'

            Write-Host "$($item.Name) coverage: $($rate * 100)%"

            if ($rate -le 0.90) {
              throw "$($item.Name) coverage must exceed 90%"
            }
          }

