
name: PPOIS Lab 1 CI

on:
  push:
    branches: [main, feature/lab1]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S lab1 -B lab1/build -G "Visual Studio 17 2022" -A x64

      - name: Build project
        run: cmake --build lab1/build --config Debug

      - name: Run unit tests
        run: ctest --test-dir lab1/build -C Debug --output-on-failure
